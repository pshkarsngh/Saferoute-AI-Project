# SafeRoute AI — Routing Configuration
# Phase ID: PHASE_13
# Follows TRD §10, ARCHITECTURE §8, master_rules.md Rules 8, 10, 13, 17

metadata:
  version: "routing-v1"
  date: "2026-10-13"
  primary_provider: "osrm"
  mock_provider: "mock"

# Provider Connection Settings
provider:
  # Live OSRM (keyless OpenStreetMap) is the real-world default. Set to "mock"
  # (or SAFEROUTE_ROUTING_PROVIDER=mock) for offline/deterministic operation.
  # Mock routes are synthetic and are NEVER substituted automatically (Rule 10).
  default_provider: "multi"
  timeout_seconds: 5.0
  max_retries: 3
  backoff_factor_seconds: 0.5
  osrm:
    base_url: "https://router.project-osrm.org"   # Public OSRM demo or local http://localhost:5000
    profile: "driving"
    overview: "full"
    geometries: "geojson"
    alternatives: true
    steps: true
  # PHASE_30: the second live routing provider. The public OSRM demo server
  # frequently returns a SINGLE route for long urban corridors (measured live:
  # Whitefield -> Bengaluru returns one route even with alternatives=true),
  # while the public Valhalla service returns several genuinely different paths
  # for the same corridor. Both are keyless, free and OpenStreetMap-based.
  valhalla:
    base_url: "https://valhalla1.openstreetmap.de"
    costing: "auto"
    alternates: 3
    timeout_seconds: 8.0
    max_retries: 2
    backoff_factor_seconds: 0.5
  # PHASE_30: composed provider. The candidates actually returned by the
  # providers above are merged, de-duplicated by corridor geometry and capped.
  # Nothing is synthesised: if the providers return one route in total, exactly
  # one route is emitted (Rule 10).
  multi:
    providers:
      - osrm
      - valhalla
    max_routes: 4
    # Two routes are treated as the same corridor when at least this share of
    # each route's geometry lies within `corridor_tolerance_m` of the other.
    corridor_overlap_threshold: 0.80
    corridor_tolerance_m: 60.0

# Segmentation Policy (TRD §10.1, PRD FR-R4)
segmentation:
  target_segment_length_m: 200.0   # Target segment granularity for imagery assessment
  min_segment_length_m: 50.0       # Minimum segment length floor
  max_segment_length_m: 500.0      # Maximum segment length ceiling
  id_format: "seg-{route_id}-{seq:04d}"

# Guardrails & Rules
guardrails:
  enforce_rule_10: true            # Never synthesize/pad routes to fixed count (Rule 10)
  imagery_rights_granted: false    # Explicit guardrail: routing API does NOT grant imagery rights (Rule 8)
  secrets_file: ".env"             # Any required API keys loaded only from local uncommitted .env (Rule 13)
