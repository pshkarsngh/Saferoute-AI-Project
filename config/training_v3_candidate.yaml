# SafeRoute AI — YOLO11 accuracy-improvement candidate (v3 candidate)
#
# PURPOSE
#   Train a genuine, measurable replacement for the current serving checkpoint,
#   which is a NON-PRODUCTION P0 smoke substitute (see
#   models/training/saferoute-yolo11-v2/P0_SMOKE_SUBSTITUTE.json).
#
# WHAT CHANGES vs the approved v2 recipe (config/training_improved.yaml)
#   1. imgsz 640 -> 768      : small potholes/cracks occupy few pixels; higher
#                              input resolution is the strongest accuracy lever.
#   2. epochs 150 -> 120     : cosine schedule + patience 30; run length bounded
#                              for a laptop GPU.
#   3. batch 16 -> 12        : 768px needs more VRAM per image (8 GB laptop GPU).
#   4. degrees 8 -> 10, close_mosaic 15 -> 20, mixup 0.15 kept.
#   5. workers 0             : host has ~1 GB free RAM; multiprocess loaders
#                              have been killed before (Rule 16).
#
# WHAT DOES NOT CHANGE
#   - Dataset: data/dataset_v2.yaml (audited derived two-class, date-atomic
#     splits; no train/val/test overlap). Originals untouched (Rule 15).
#   - Classes: 0 pothole, 1 crack only. Unsupported classes stay unsupported.
#   - The serving checkpoint is NEVER read or overwritten by this run.
#   - No risk formula, threshold or config is modified (Rules 7, 9, 18).
#
# OUTPUT
#   models/training/_tmp_v3_candidate/  (temporary; promotion requires explicit
#   approval and a fresh held-out test evaluation, per Rule 14/19/20).

experiment:
  name: "saferoute-yolo11-v3-candidate"
  model_version: "saferoute-yolo11-v3-candidate"
  phase_id: "ACCURACY-V3"
  date_frozen: "2026-11-11"

model:
  variant: "yolo11n"
  pretrained_weights: "yolo11n.pt"   # local workspace file (no download, Rule 19)
  licence: "AGPL-3.0 / Enterprise"
  download_status: "already_present_in_workspace"

dataset:
  config_path: "data/dataset_v2.yaml"
  num_classes: 2
  classes:
    0: "pothole"
    1: "crack"
  unsupported_classes:
    2: "manhole"

hyperparameters:
  imgsz: 768
  batch: 12
  epochs: 120
  patience: 30
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  amp: true
  seed: 42
  deterministic: true
  workers: 0
  device: 0
  cos_lr: true

  augmentation:
    mosaic: 1.0
    mixup: 0.15
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 10.0
    translate: 0.1
    scale: 0.5
    shear: 2.0
    perspective: 0.0005
    fliplr: 0.5
    flipud: 0.0
    close_mosaic: 20

paths:
  project: "models/training/_tmp_v3_candidate"
  name: "candidate_v3"
  log_dir: "logs/training/_tmp_v3_candidate"
  save_period: 10
