# SafeRoute AI - DATA-YOLO experimental training configuration (PROPOSED, not run)
# Candidate model id : saferoute-yolo11-datayolo-exp
#
# PURPOSE
#   Train an EXPERIMENTAL two-class (0=pothole, 1=crack) candidate on the
#   prepared DATA-YOLO dataset (data/datayolo_prep/) so the effect of the
#   DATA-YOLO data can be measured later.
#
# SAFETY
#   * Reads the prepared, isolated dataset produced by
#     scripts/prepare_datayolo_2class.py (DATA-YOLO originals are untouched).
#   * Writes only to models/training/saferoute-yolo11-datayolo-exp and
#     logs/training/saferoute-yolo11-datayolo-exp  (distinct from v2).
#   * It does NOT read, write, or promote the serving checkpoint
#     (config/detection.yaml -> models/training/saferoute-yolo11-v2/weights/best.pt).
#   * Do NOT run until the preparation report has been reviewed.

experiment:
  name: "saferoute-yolo11-datayolo-exp"
  model_version: "saferoute-yolo11-datayolo-exp"
  phase_id: "TRAIN-DATAYOLO-EXP"
  date_frozen: "2026-10-16"

model:
  variant: "yolo11n"
  # Default: train from the official pretrained backbone (same start as v2).
  pretrained_weights: "yolo11n.pt"
  # ALTERNATIVE (transfer-learn from the current detector instead of scratch):
  #   pretrained_weights: "models/training/saferoute-yolo11-v2/weights/best.pt"
  # Either way the run reads the file and writes a NEW output dir, so the
  # serving v2 checkpoint is never overwritten.
  licence: "AGPL-3.0 / Enterprise"
  download_status: "already_present_in_workspace"

dataset:
  # NEW prepared dataset config (separate from data/dataset.yaml).
  config_path: "data/datayolo_prep/dataset.yaml"
  num_classes: 2
  classes:
    0: "pothole"
    1: "crack"
  unsupported_classes:
    2: "manhole"            # images containing manhole are EXCLUDED in prep (never relabelled)

hyperparameters:
  imgsz: 640
  batch: 16
  epochs: 150
  patience: 40
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  box: 7.5
  cls: 0.5
  dfl: 1.5
  amp: true
  seed: 42
  deterministic: true
  # workers=0: this host has very little free RAM (~2 GB). Multiprocess DataLoader
  # workers were being killed (RuntimeError: DataLoader worker exited unexpectedly).
  # 0 keeps loading in-process (slower but stable) and does not change the maths.
  workers: 0
  device: 0
  cos_lr: true

  augmentation:
    mosaic: 1.0
    mixup: 0.15
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 8.0
    translate: 0.1
    scale: 0.5
    shear: 2.0
    perspective: 0.0005
    fliplr: 0.5
    flipud: 0.0
    close_mosaic: 15

paths:
  project: "models/training"
  name: "saferoute-yolo11-datayolo-exp"
  log_dir: "logs/training/saferoute-yolo11-datayolo-exp"
  save_period: 10
